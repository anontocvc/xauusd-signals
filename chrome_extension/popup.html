<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XAUUSD Signals</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:380px;min-height:300px;background:#0a0c10;color:#e2e8f0;font-family:'Courier New',monospace;font-size:12px}
.header{background:#111520;border-bottom:1px solid #1e2a3a;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.logo-box{background:rgba(245,158,11,.12);border:1px solid #f59e0b;border-radius:5px;padding:3px 7px;color:#f59e0b;font-weight:700;font-size:11px;margin-right:8px}
.live-dot{width:7px;height:7px;border-radius:50%;background:#64748b;display:inline-block;margin-right:4px;transition:all .3s}
.live-dot.on{background:#10b981;box-shadow:0 0 5px #10b981}
.price{font-size:18px;font-weight:700;color:#f59e0b;text-align:center;padding:8px 14px;border-bottom:1px solid #1e2a3a}
.price-sub{font-size:9px;color:#64748b;text-align:center;padding:3px 14px 6px}
.section{padding:8px 12px;border-bottom:1px solid #1e2a3a}
.section-title{font-size:9px;color:#64748b;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.sig-row{background:#111520;border-radius:6px;padding:8px 10px;margin-bottom:6px;border-left:3px solid #1e2a3a}
.sig-row.sniper{border-left-color:#a855f7}.sig-row.high{border-left-color:#10b981}
.sig-row.medium{border-left-color:#3b82f6}.sig-row.low{border-left-color:#64748b}
.sig-row.aggressive{border-left-color:#ef4444}
.sig-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.sig-dir{font-weight:700;font-size:13px}
.dir-buy{color:#10b981}.dir-sell{color:#ef4444}
.sig-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px}
.badge-sniper{background:rgba(168,85,247,.15);color:#a855f7}
.badge-high{background:rgba(16,185,129,.15);color:#10b981}
.badge-medium{background:rgba(59,130,246,.15);color:#3b82f6}
.badge-low{background:rgba(100,116,139,.15);color:#94a3b8}
.badge-aggressive{background:rgba(239,68,68,.15);color:#ef4444}
.sig-levels{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:10px}
.lvl{background:#161b27;border-radius:4px;padding:3px 5px;text-align:center}
.lvl-label{color:#64748b;font-size:8px;letter-spacing:.5px;text-transform:uppercase}
.lvl-val{font-weight:600}
.entry-col{color:#f59e0b}.sl-col{color:#ef4444}.tp-col{color:#10b981}
.sig-meta{display:flex;justify-content:space-between;font-size:9px;color:#64748b;margin-top:4px}
.offline-msg{text-align:center;padding:20px;color:#64748b}
.btn-link{display:block;width:calc(100% - 24px);margin:8px 12px;padding:7px;background:rgba(245,158,11,.1);border:1px solid #f59e0b;color:#f59e0b;border-radius:6px;font-size:11px;font-weight:600;text-align:center;text-decoration:none}
.htf-row{display:flex;justify-content:space-between;padding:3px 0}
.htf-label{color:#64748b;font-size:10px}
.htf-val{font-size:10px;font-weight:600}
.bull-v{color:#10b981}.bear-v{color:#ef4444}.neut-v{color:#94a3b8}
.news-item{display:flex;gap:6px;align-items:center;padding:3px 0;font-size:10px;border-bottom:1px solid #1e2a3a}
.news-item:last-child{border-bottom:none}
.news-imp{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px}
.imp-high{background:rgba(239,68,68,.15);color:#ef4444}
.imp-med{background:rgba(245,158,11,.12);color:#f59e0b}
.news-txt{flex:1;color:#94a3b8}.news-time{color:#64748b;font-size:9px}
.footer{padding:6px 12px;display:flex;justify-content:space-between;align-items:center;background:#111520}
.footer-text{font-size:9px;color:#64748b}
.refresh-btn{background:transparent;border:1px solid #1e2a3a;color:#94a3b8;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:9px}
</style>
</head>
<body>
<div class="header">
  <div style="display:flex;align-items:center">
    <div class="logo-box">XAU</div>
    <span style="color:#94a3b8;font-size:11px;font-weight:600">SIGNAL WATCH</span>
  </div>
  <div style="display:flex;align-items:center">
    <span class="live-dot" id="live-dot"></span>
    <span id="status-text" style="font-size:9px;color:#64748b">Connecting...</span>
  </div>
</div>
<div class="price" id="price-display">Loading...</div>
<div class="price-sub" id="price-sub">Starting up...</div>
<div id="main-content">
  <div class="offline-msg">
    <div style="margin-bottom:8px;color:#94a3b8">Start the server first:</div>
    <span style="color:#f59e0b;font-size:10px">python app.py</span>
    <div style="margin-top:8px;font-size:10px">Then click Refresh</div>
  </div>
</div>
<a href="http://localhost:5000" target="_blank" class="btn-link">↗ Open Full Dashboard</a>
<div class="footer">
  <span class="footer-text" id="last-poll">—</span>
  <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
</div>
<script src="popup.js"></script>
</body>
</html>
